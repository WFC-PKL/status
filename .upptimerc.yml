# Uptime monitor and status page for WFC Pekalongan.
# Checks run from GitHub Actions every 5 minutes, outside Cloudflare.
# Runbook: WFC-PKL/wfcp docs/operations.md, "Monitoring and outages".
owner: WFC-PKL
repo: status
user-agent: WFC-PKL

sites:
  - name: Website
    url: https://wfc.my.id/
    maxResponseTime: 10000
  - name: Jono (bot Telegram)
    url: https://bot.wfc.my.id/
    maxResponseTime: 10000

# Only these secrets reach Upptime (GH_PAT is passed separately).
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID

# Keep our own repository description and topics.
skipDescriptionUpdate: true
skipTopicsUpdate: true

status-website:
  cname: status.wfc.my.id
  name: Status WFC Pekalongan
  logoUrl: https://status.wfc.my.id/logo.svg
  favicon: https://wfc.my.id/favicon.ico
  themeUrl: https://status.wfc.my.id/wfc-theme.css
  introTitle: "**Status layanan WFC Pekalongan**"
  introMessage: Website [wfc.my.id](https://wfc.my.id) dan bot Telegram Jono dicek dari luar setiap 5 menit. Kalau ada gangguan, pengurus langsung dapat kabar.
  navbar:
    - title: Status
      href: /
    - title: wfc.my.id
      href: https://wfc.my.id
  metaTags:
    - name: color-scheme
      content: light dark

